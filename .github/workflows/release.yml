name: Publish Release

on:
  push:
    tags:
      - '*'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release-pro:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Create bdthemes-element-pack-lite directory and move files
        run: |
          mkdir -p bdthemes-element-pack-lite &&
          find . -maxdepth 1 -not -name 'bdthemes-element-pack-lite' -exec mv {} bdthemes-element-pack-lite \;

      - name: Archive release
        uses: thedoctor0/zip-release@0.7.6
        with:
          filename: 'bdthemes-element-pack-lite.zip'
          exclusions: "/*node_modules/* /*less/* /*tests/* /*gruntfile.js /*package.json /*package-lock.json /*sync.ffs_db /*.idea/* /*.DS_Store /*.gitignore /*.github/* /*.git/* /*LICENSE /*.eslintrc /*.gitattributes /*.prettierrc"

      - name: Verify release archive
        run: |
          echo "PWD:"
          pwd

          echo "Files:"
          ls -lah

          echo "ZIP:"
          ls -lah ./bdthemes-element-pack-lite.zip

          echo "ZIP size:"
          du -h ./bdthemes-element-pack-lite.zip

          echo "ZIP integrity:"
          unzip -t ./bdthemes-element-pack-lite.zip

          test -s ./bdthemes-element-pack-lite.zip

      - name: Create Release
        uses: ncipollo/release-action@v1.14.0
        with:
          artifacts: './bdthemes-element-pack-lite.zip'
          token: ${{ secrets.TOKEN }}
          removeArtifacts: true
          allowUpdates: true
          artifactErrorsFailBuild: true
          makeLatest: true
          tag: ${{ github.ref_name }}
