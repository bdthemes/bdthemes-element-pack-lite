name: Publish Release
on:
  release:
    types: [published]

permissions:
  contents: write

# Belt and braces: never allow two release jobs for the same tag to overlap.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  PLUGIN_SLUG: bdthemes-element-pack-lite

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build plugin directory
        run: |
          set -euo pipefail

          # Copy the plugin into a folder named after the slug so the zip
          # extracts as bdthemes-element-pack-lite/... (WordPress requirement).
          BUILD_DIR="$RUNNER_TEMP/build/$PLUGIN_SLUG"
          mkdir -p "$BUILD_DIR"

          rsync -a ./ "$BUILD_DIR/" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.gitignore' \
            --exclude '.gitattributes' \
            --exclude '.idea' \
            --exclude '.DS_Store' \
            --exclude '.eslintrc' \
            --exclude '.prettierrc' \
            --exclude 'node_modules' \
            --exclude 'tests' \
            --exclude 'test' \
            --exclude 'gruntfile.js' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude '*sync.ffs_db' \
            --exclude 'src/uikit-less' \
            --exclude '*.zip'

          echo "BUILD_DIR=$RUNNER_TEMP/build" >> "$GITHUB_ENV"

          echo "Top level of build dir:"
          ls -la "$BUILD_DIR"

      - name: Create zip archive
        run: |
          set -euo pipefail
          cd "$BUILD_DIR"
          rm -f "$GITHUB_WORKSPACE/$PLUGIN_SLUG.zip"
          zip -r -X "$GITHUB_WORKSPACE/$PLUGIN_SLUG.zip" "$PLUGIN_SLUG" -x '*.DS_Store'

      - name: Verify release archive
        run: |
          set -euo pipefail
          ZIP="$GITHUB_WORKSPACE/$PLUGIN_SLUG.zip"

          echo "ZIP size:"
          ls -lah "$ZIP"
          test -s "$ZIP"

          echo "ZIP integrity:"
          unzip -tq "$ZIP"

          echo "Main plugin file present at expected path:"
          unzip -l "$ZIP" | grep -q " $PLUGIN_SLUG/$PLUGIN_SLUG.php$"
          unzip -l "$ZIP" | grep -q " $PLUGIN_SLUG/readme.txt$"

          echo "Nothing unwanted leaked into the zip:"
          ! unzip -l "$ZIP" | grep -E " $PLUGIN_SLUG/(\.git/|\.github/|node_modules/|tests?/|package\.json|gruntfile\.js|src/uikit-less/)"

          echo "File count:"
          unzip -l "$ZIP" | tail -1

      - name: Upload zip to release
        uses: ncipollo/release-action@v1.14.0
        with:
          artifacts: ${{ github.workspace }}/${{ env.PLUGIN_SLUG }}.zip
          token: ${{ secrets.TOKEN }}
          tag: ${{ github.event.release.tag_name }}
          allowUpdates: true
          replacesArtifacts: true
          removeArtifacts: false
          artifactErrorsFailBuild: true
          makeLatest: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          omitDraftDuringUpdate: true
